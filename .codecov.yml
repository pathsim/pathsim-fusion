codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    # total coverage may not drop by more than 1 % against the base commit
    project:
      default:
        target: auto
        threshold: 1%
    # lines added or changed in a PR should be covered
    patch:
      default:
        target: 90%

comment:
  layout: "condensed_header, diff, files"
  behavior: default
  require_changes: false
