[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pathsim-fusion"
dynamic = ["version"]
description = "Fusion fuel cycle and balance-of-plant blocks for PathSim"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "PathSim Contributors"}
]
keywords = ["simulation", "pathsim", "block diagram", "fusion", "tritium", "fuel cycle", "balance of plant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    # GLC passes a graded initial mesh to BVP1D, from pathsim 0.30.3
    "pathsim>=0.30.3",
    "numpy>=1.15",
    "scipy>=1.2",
    # If your toolbox needs a dependency that ships native code (e.g.
    # pybamm, jsbsim, casadi, …) it will fail to install in Pyodide. Tag
    # it with a PEP 508 environment marker so a normal pip install on
    # Linux/macOS/Windows still pulls it eagerly, but micropip in the
    # browser silently skips it. Example:
    #
    #     "pybamm>=25.12; sys_platform != 'emscripten'",
    #
    # Pair this with a defensive `try/except ImportError` re-export in
    # `src/pathsim_<name>/__init__.py` so the rest of the toolbox stays
    # importable when the heavy dependency is absent.
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
# Pinned so local runs and CI apply the same default rule set
lint = [
    "ruff==0.17.3",
]

[project.urls]
Homepage = "https://pathsim.org"
Documentation = "https://docs.pathsim.org/fusion"
Repository = "https://github.com/pathsim/pathsim-fusion"
Issues = "https://github.com/pathsim/pathsim-fusion/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
write_to = "src/pathsim_fusion/_version.py"

[tool.mypy]
files = ["src/pathsim_fusion"]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.ruff]
src = ["src", "tests"]
